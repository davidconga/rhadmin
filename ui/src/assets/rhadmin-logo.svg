    <rect x="-7" y="-72" width="14" height="18" rx="4" fill="#0F6E56" transform="rotate(60)"/>
    <rect x="-7" y="-72" width="14" height="18" rx="4" fill="#0F6E56" transform="rotate(120)"/>
