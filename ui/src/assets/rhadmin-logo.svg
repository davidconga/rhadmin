<svg viewBox="0 0 680 300" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RHadmin</title>
  <desc>Logótipo RHadmin: ícone engrenagem com pessoas e texto RH Admin</desc>

  <!-- Sem fundo (transparente) -->

