  <text x="264" y="180" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#9FE1CB" letter-spacing="8">Admin</text>
  <text x="340" y="225" font-family="Arial, sans-serif" font-size="12" fill="#5DCAA5" text-anchor="middle" letter-spacing="2.5">GESTÃO DE RECURSOS HUMANOS</text>
  <rect x="80" y="238" width="520" height="1" rx="0.5" fill="#0F6E56"/>
