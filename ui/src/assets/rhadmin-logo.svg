    <circle cx="0" cy="0" r="68" fill="#0F6E56"/>
    <circle cx="0" cy="0" r="50" fill="#085041"/>

    <rect x="-7" y="-72" width="14" height="18" rx="4" fill="#0F6E56"/>
    <rect x="-7" y="54" width="14" height="18" rx="4" fill="#0F6E56"/>
    <rect x="54" y="-7" width="18" height="14" rx="4" fill="#0F6E56"/>
    <rect x="-72" y="-7" width="18" height="14" rx="4" fill="#0F6E56"/>
